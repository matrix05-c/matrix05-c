<text x="56" y="238" class="l8" xml:space="preserve"><tspan class="k">    |&gt; </tspan><tspan class="c">Enum.map</tspan><tspan class="c">(&amp;</tspan><tspan class="c">String.downcase</tspan><tspan class="c">(</tspan><tspan class="c">Atom.to_string</tspan><tspan class="c">(&amp;1)))</tspan></text>
