<text x="22" y="194" class="ln"> 7</text>
<text x="56" y="194" class="l6" xml:space="preserve"><tspan class="k">  def </tspan><tspan class="m">stack </tspan><tspan class="k">do</tspan></text>
<text x="22" y="216" class="ln"> 8</text>
