<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Modèle conceptuel animé des compétences de Caddy">
<title>Modèle conceptuel animé des compétences de Caddy</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:#14111c}
.box{fill:#1f1a2b;stroke:#4a3d63;stroke-width:1.5}
.head{fill:#2e2542}
.name{fill:#ece6f5;font-size:13px;font-weight:700;letter-spacing:.5px}
.attr{fill:#a89bbd;font-size:12px}
.main .box{stroke:#b48ee0;stroke-width:2} .main .head{fill:#5b3a86}
.new .box{stroke:#e48ac6;stroke-width:2;animation:glow 2.4s ease-in-out infinite} .new .head{fill:#7a2e63}
.rel{stroke:#6c5a8c;stroke-width:2;fill:none;stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
.hot{stroke:#e48ac6;stroke-width:2.5}
.lbl rect{fill:#14111c;stroke:#4a3d63} .lbl text{fill:#c9bde0;font-size:11px}
.ent,.lbl{opacity:0;animation:pop .6s cubic-bezier(.2,.8,.2,1.2) forwards}
.new{animation:pop .6s cubic-bezier(.2,.8,.2,1.2) forwards}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes glow{0%,100%{stroke-opacity:1}50%{stroke-opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.ent,.lbl{opacity:1}}
</style>
<rect class="bg" width="800" height="450" rx="14"/>
<path class="rel" d="M400.0 198.0L140.0 78.0"/>
<g class="lbl" style="animation-delay:1.60s"><rect x="228.0" y="127.0" width="84" height="20" rx="10"/><text x="270.0" y="141.0" text-anchor="middle">maîtrise</text></g>
<path class="rel" d="M400.0 198.0L660.0 78.0"/>
<g class="lbl" style="animation-delay:1.75s"><rect x="488.0" y="127.0" width="84" height="20" rx="10"/><text x="530.0" y="141.0" text-anchor="middle">réalise</text></g>
<path class="rel" d="M660.0 78.0L660.0 318.0"/>
<g class="lbl" style="animation-delay:1.90s"><rect x="618.0" y="187.0" width="84" height="20" rx="10"/><text x="660.0" y="201.0" text-anchor="middle">stocke dans</text></g>
<path class="rel" d="M400.0 198.0L140.0 318.0"/>
<g class="lbl" style="animation-delay:2.05s"><rect x="228.0" y="247.0" width="84" height="20" rx="10"/><text x="270.0" y="261.0" text-anchor="middle">suit</text></g>
<path class="rel hot" d="M400.0 198.0L400.0 378.0"/>
<g class="lbl" style="animation-delay:2.20s"><rect x="358.0" y="277.0" width="84" height="20" rx="10"/><text x="400.0" y="291.0" text-anchor="middle">apprend</text></g>
<path class="rel" d="M660.0 78.0L140.0 78.0"/>
<g class="lbl" style="animation-delay:2.35s"><rect x="358.0" y="67.0" width="84" height="20" rx="10"/><text x="400.0" y="81.0" text-anchor="middle">utilise</text></g>
<g class="ent main" style="animation-delay:0.00s"><rect x="300" y="150" width="200" height="96" rx="10" class="box"/><path d="M300 160a10 10 0 0 1 10 -10h180a10 10 0 0 1 10 10v20h-200z" class="head"/><text x="400.0" y="170" text-anchor="middle" class="name">CADDY</text><text x="314" y="202" class="attr">nom</text><text x="314" y="222" class="attr">role</text><text x="314" y="242" class="attr">ville</text></g>
<g class="ent" style="animation-delay:0.18s"><rect x="40" y="30" width="200" height="96" rx="10" class="box"/><path d="M40 40a10 10 0 0 1 10 -10h180a10 10 0 0 1 10 10v20h-200z" class="head"/><text x="140.0" y="50" text-anchor="middle" class="name">LANGAGE</text><text x="54" y="82" class="attr">Java · PHP · JS</text><text x="54" y="102" class="attr">C# · Python · R</text></g>
<g class="ent" style="animation-delay:0.36s"><rect x="560" y="30" width="200" height="96" rx="10" class="box"/><path d="M560 40a10 10 0 0 1 10 -10h180a10 10 0 0 1 10 10v20h-200z" class="head"/><text x="660.0" y="50" text-anchor="middle" class="name">PROJET</text><text x="574" y="82" class="attr">7 projets</text><text x="574" y="102" class="attr">web · desktop · data</text></g>
<g class="ent" style="animation-delay:0.54s"><rect x="560" y="270" width="200" height="96" rx="10" class="box"/><path d="M560 280a10 10 0 0 1 10 -10h180a10 10 0 0 1 10 10v20h-200z" class="head"/><text x="660.0" y="290" text-anchor="middle" class="name">BASE_DE_DONNEES</text><text x="574" y="322" class="attr">MySQL · PostgreSQL</text><text x="574" y="342" class="attr">Oracle</text></g>
<g class="ent" style="animation-delay:0.72s"><rect x="40" y="270" width="200" height="96" rx="10" class="box"/><path d="M40 280a10 10 0 0 1 10 -10h180a10 10 0 0 1 10 10v20h-200z" class="head"/><text x="140.0" y="290" text-anchor="middle" class="name">FORMATION</text><text x="54" y="322" class="attr">Licence GL &amp; BD</text><text x="54" y="342" class="attr">ENI Fianarantsoa</text></g>
<g class="ent new" style="animation-delay:0.90s"><rect x="300" y="330" width="200" height="96" rx="10" class="box"/><path d="M300 340a10 10 0 0 1 10 -10h180a10 10 0 0 1 10 10v20h-200z" class="head"/><text x="400.0" y="350" text-anchor="middle" class="name">ELIXIR</text><text x="314" y="382" class="attr">OTP · BEAM</text><text x="314" y="402" class="attr">Phoenix</text></g>
</svg>
